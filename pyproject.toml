[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-workload-forecasting"
version = "1.0.0"
description = "Analysis and short-horizon forecasting for Azure VM workload traces"
requires-python = ">=3.11"
dependencies = [
	"matplotlib>=3.9,<4",
	"numpy>=1.26,<3",
	"pandas>=2.0,<4",
	"PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]